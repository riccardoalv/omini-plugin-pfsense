id: pfsense
name: pfSense
version: 0.2.1
protocol: 1
entrypoint: main.py
timeout_s: 60
description: >-
  pfSense CE and Plus firewalls through the pfSense REST API package (v2):
  interfaces with link speed and traffic, WANs and gateway status, ARP, DHCP
  leases and pool usage, VLANs, LAGGs, services, VPN peers, firewall states,
  local DNS names, paused devices, NAT port forwards, CPU, memory, swap, load,
  temperature and uptime. It also turns interfaces on or off, manages each
  VLAN's network (VLAN, interface, gateway, DHCP range and access rules), the
  DHCP server's fixed addresses, the DNS Resolver's local names and paused
  devices, and sends Wake-on-LAN packets, when its user has the write
  privileges.
author: Omini
homepage: https://github.com/riccardoalv/omini-plugin-pfsense
changes:
  - port.enabled
  - network.set
  - network.delete
  - reservation.set
  - reservation.delete
  - dns.set
  - dns.delete
  - wol.send
  - pause.set
  - pause.delete
fields:
  - key: url
    type: url
    label: Address
    required: true
    help: The pfSense web interface, e.g. https://192.168.1.1
  - key: api_key
    type: secret
    label: API key
    required: true
    help: >-
      A key of the REST API package, issued to a pfSense user that has only the
      privileges listed in the plugin's README (read only, or also the write
      ones to change networks from Omini).
  - key: verify_tls
    type: bool
    label: Verify the TLS certificate
    default: false
    help: pfSense uses a self-signed certificate by default; turn this on if yours is trusted.
